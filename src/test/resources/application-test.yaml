spring:
  datasource:
    url: jdbc:h2:mem:order-ledger-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC

app:
  pagination:
    max-page-size: 50
  jwt:
    issuer: test-suite
    secret: test-suite-secret-key-with-at-least-thirty-two-chars
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  bootstrap-admin:
    email: admin@example.com
    password: AdminPass123!
    display-name: Test Admin
