spring:
  application:
    name: order-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_ledger}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  web:
    error:
      include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    enabled: true

app:
  pagination:
    max-page-size: ${APP_MAX_PAGE_SIZE:100}
  jwt:
    issuer: ${APP_JWT_ISSUER:order-ledger}
    secret: ${APP_JWT_SECRET:change-this-development-secret-to-a-minimum-32-char-value}
    access-token-expiration-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_TTL_DAYS:14}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Platform Admin}
